:root{--purple:#7C3AED;--deep:#4C1D95;--violet:#A78BFA;--lav:#C4B5FD;--peri:#818CF8;--pink:#F472B6;
 --bg:#150B2E;--card:#201349;--card2:#291A5C;--line:#3A2A73;--ink:#F3EEFF;--mute:#BBB0DC;--head:#fff;--acc:#C4B5FD;--hdr:rgba(21,11,46,.88);--btn:#2A1B5E;
 --show:linear-gradient(150deg,#33207A,#2A1B66 60%,#4A1F6B);--shadow:0 18px 50px -24px rgba(124,58,237,.6);
 --glow:radial-gradient(60% 38% at 88% -4%,rgba(124,58,237,.38),transparent 70%),radial-gradient(42% 30% at 4% 30%,rgba(129,140,248,.2),transparent 70%),radial-gradient(36% 26% at 96% 64%,rgba(244,114,182,.12),transparent 70%);
 --display:"Bricolage Grotesque",Manrope,system-ui,sans-serif;color-scheme:dark}
:root[data-theme=light]{--bg:#F3EEFF;--card:#FBF9FF;--card2:#EADFFF;--line:#D6C9F5;--ink:#241A45;--mute:#625881;--head:#3B1A85;--acc:#6D28D9;--hdr:rgba(243,238,255,.9);--btn:#fff;
 --show:linear-gradient(150deg,#E2D7FF,#DCE0FF 60%,#FBDDEE);--shadow:0 14px 36px -20px rgba(76,29,149,.35);
 --glow:radial-gradient(60% 38% at 88% -4%,rgba(124,58,237,.16),transparent 70%),radial-gradient(42% 30% at 4% 30%,rgba(129,140,248,.14),transparent 70%),radial-gradient(36% 26% at 96% 64%,rgba(244,114,182,.12),transparent 70%);color-scheme:light}
*,*:before,*:after{box-sizing:border-box}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{margin:0;background:var(--glow),var(--bg);color:var(--ink);font:400 16px/1.55 Manrope,system-ui,-apple-system,Segoe UI,sans-serif;-webkit-font-smoothing:antialiased;overflow-x:hidden}
a{color:inherit;text-decoration:none}p{margin:0}
h1,h2,h3{margin:0;font-family:var(--display);color:var(--head);line-height:1.05;letter-spacing:-.025em}
h1{font-size:clamp(2.1rem,4.4vw,3.5rem);font-weight:800}
h2{font-size:clamp(1.55rem,2.8vw,2.2rem);font-weight:700}
h3{font-size:1.1rem;font-weight:700;letter-spacing:-.015em}
.wrap{max-width:1160px;margin:0 auto;padding:0 20px}
.ic{width:18px;height:18px;flex:none;fill:none;stroke:currentColor;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.ic.br{fill:currentColor;stroke:none}
.k{--cc:var(--c)}:root[data-theme=light] .k{--cc:var(--cl)}
.k1{--c:#A78BFA;--cl:#6D28D9}.k2{--c:#818CF8;--cl:#4F46E5}.k3{--c:#F472B6;--cl:#BE185D}.k4{--c:#67E8F9;--cl:#0E7490}.k5{--c:#FCD34D;--cl:#B45309}.k6{--c:#6EE7B7;--cl:#047857}
.chip{display:grid;place-items:center;width:40px;height:40px;border-radius:12px;flex:none;background:color-mix(in srgb,var(--cc,#A78BFA) 20%,transparent);color:var(--cc,var(--acc))}
.chip .ic{width:20px;height:20px}
:focus-visible{outline:3px solid var(--violet);outline-offset:2px;border-radius:8px}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 20px;border-radius:12px;font-weight:700;font-size:15px;border:1.5px solid var(--line);background:var(--btn);color:var(--head);transition:transform .18s,border-color .18s,box-shadow .18s,background .18s;white-space:nowrap;cursor:pointer}
.btn:hover{border-color:var(--violet);transform:translateY(-1px)}
.btn .ic{width:16px;height:16px;transition:transform .18s}.btn:hover .go{transform:translateX(3px)}
.btn.p{background:linear-gradient(135deg,#7C3AED,#6D4FE8);border-color:transparent;color:#fff}
.btn.p:hover{box-shadow:0 10px 24px -10px #7C3AED;background:linear-gradient(135deg,#8B4DF5,#818CF8)}
.eyebrow{display:inline-flex;align-items:center;gap:8px;font-size:12.5px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--acc)}
.eyebrow i{width:7px;height:7px;border-radius:50%;background:var(--pink)}
section{padding:36px 0}
.sh{margin-bottom:20px}.sh h2{margin-top:8px}
/* header */
header{position:sticky;top:0;z-index:50;background:var(--hdr);backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);border-bottom:1px solid var(--line)}
header .in{display:flex;align-items:center;justify-content:space-between;height:64px;gap:14px}
.logo{display:flex;align-items:center;gap:9px;font:800 19px var(--display);color:var(--head)}
